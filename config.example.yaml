# lite-cpa example configuration
host: ""
port: 8317

api-keys:
  - "sk-lite-gateway"

request-retry: 2
debug: false

# Optional request recording (disabled by default).
# Diagnostics still go to stderr; this is structured request metadata storage.
request-log:
  enabled: false
  backend: "sqlite"          # sqlite | postgres
  retention: "168h"          # Go duration; rows older than this are deleted hourly
  store-body: false          # if true, store req/resp body (capped 64KiB; streams omit resp body)
  sqlite:
    path: "logs/requests.db"
  # postgres:
  #   dsn: "postgres://litecpa:litecpa@postgres:5432/litecpa?sslmode=disable"

# Upstream field order:
#   1. name
#   2. headers
#   3. base-url
#   4. api-key
#   5. models
#
# Unset headers.User-Agent → Go default "Go-http-client/1.1"

# Anthropic Messages (standard /v1/messages)
anthropic-messages:
  - name: "anthropic-official"
    headers:
      User-Agent: "claude-cli/2.1.63 (external, cli)"
      # Anthropic-Beta: "claude-code-20250219"
    base-url: "https://api.anthropic.com"
    api-key: "sk-ant-your-key"
    models:
      - name: "claude-sonnet-4"
        alias: "claude-sonnet-4"
    # api-key-entries:
    #   - api-key: "sk-ant-1"
    #     priority: 0
    #   - api-key: "sk-ant-2"
    #     proxy-url: "http://proxy:8080"

# OpenAI Responses API (standard POST /v1/responses) — not Codex
openai-responses:
  - name: "openai-responses"
    headers:
      User-Agent: "codex_cli_rs/0.144.1"
    base-url: "https://api.openai.com/v1"
    api-key: "sk-openai-responses-key"
    models:
      - name: "gpt-5"
        alias: "gpt-5"

# OpenAI Chat Completions-compatible (POST /chat/completions)
openai-completions:
  - name: "deepseek"
    headers:
      User-Agent: "curl/8.7.1"
    base-url: "https://api.deepseek.com/v1"
    api-key: "sk-deepseek-key"
    models:
      - name: "deepseek-chat"
        alias: "deepseek-chat"
    # api-key-entries:
    #   - api-key: "sk-1"
    #   - api-key: "sk-2"
