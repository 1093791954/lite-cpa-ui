<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lite-cpa · Logs</title>
  <link rel="stylesheet" href="/assets/pico-2.1.1.classless.min.css" />
  <style>
    :root, [data-theme="light"] {
      --bg0: #f5f5f7;
      --bg1: #eef0f4;
      --bg2: #e7eaf1;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(255, 255, 255, 0.86);
      --glass-soft: rgba(255, 255, 255, 0.5);
      --stroke: rgba(0, 0, 0, 0.06);
      --stroke-strong: rgba(0, 0, 0, 0.1);
      --text: #1d1d1f;
      --text-secondary: #424245;
      --muted: #86868b;
      --ok: #34c759;
      --ok-soft: rgba(52, 199, 89, 0.12);
      --err: #ff3b30;
      --err-soft: rgba(255, 59, 48, 0.12);
      --warn: #ff9500;
      --warn-soft: rgba(255, 149, 0, 0.14);
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --accent-soft: rgba(0, 113, 227, 0.1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.06), 0 1px 0 rgba(255, 255, 255, 0.7) inset;
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
      --row-hover: rgba(0, 113, 227, 0.05);
      --input-bg: rgba(255, 255, 255, 0.7);
      --track: rgba(0, 0, 0, 0.05);
      --bar: linear-gradient(90deg, #64b5ff, #0071e3);
      --blob-a: rgba(120, 180, 255, 0.32);
      --blob-b: rgba(190, 160, 255, 0.22);
      --blob-c: rgba(140, 220, 200, 0.2);
      --dialog-bg: rgba(255, 255, 255, 0.82);
      --pre-bg: rgba(0, 0, 0, 0.03);
      --banner-bg: rgba(255, 196, 87, 0.18);
      --banner-border: rgba(217, 119, 6, 0.24);
      --banner-text: #92400e;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
              "Helvetica Neue", system-ui, sans-serif;
      --pico-font-family: var(--sans);
      --pico-background-color: var(--bg0);
      --pico-color: var(--text);
      --pico-muted-color: var(--muted);
      --pico-muted-border-color: var(--stroke-strong);
      --pico-primary: var(--accent);
      --pico-primary-background: var(--accent);
      --pico-primary-border: var(--accent);
      --pico-primary-hover: var(--accent-hover);
      --pico-primary-hover-background: var(--accent-hover);
      --pico-primary-hover-border: var(--accent-hover);
      --pico-form-element-background-color: var(--input-bg);
      --pico-form-element-border-color: var(--stroke-strong);
      --pico-form-element-color: var(--text);
      --pico-form-element-focus-color: var(--accent-soft);
      --pico-border-radius: 12px;
    }

    [data-theme="dark"] {
      --bg0: #000000;
      --bg1: #0a0a0c;
      --bg2: #141418;
      --glass: rgba(28, 28, 30, 0.66);
      --glass-strong: rgba(44, 44, 48, 0.8);
      --glass-soft: rgba(28, 28, 30, 0.42);
      --stroke: rgba(255, 255, 255, 0.08);
      --stroke-strong: rgba(255, 255, 255, 0.14);
      --text: #f5f5f7;
      --text-secondary: #d1d1d6;
      --muted: #86868b;
      --ok: #30d158;
      --ok-soft: rgba(48, 209, 88, 0.16);
      --err: #ff453a;
      --err-soft: rgba(255, 69, 58, 0.16);
      --warn: #ffd60a;
      --warn-soft: rgba(255, 214, 10, 0.16);
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --accent-soft: rgba(10, 132, 255, 0.18);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      --shadow-sm: 0 2px 16px rgba(0, 0, 0, 0.3);
      --row-hover: rgba(10, 132, 255, 0.08);
      --input-bg: rgba(28, 28, 30, 0.6);
      --track: rgba(255, 255, 255, 0.08);
      --bar: linear-gradient(90deg, #0a84ff, #64b5ff);
      --blob-a: rgba(10, 132, 255, 0.22);
      --blob-b: rgba(191, 90, 242, 0.16);
      --blob-c: rgba(48, 209, 104, 0.12);
      --dialog-bg: rgba(28, 28, 30, 0.84);
      --pre-bg: rgba(0, 0, 0, 0.3);
      --banner-bg: rgba(255, 214, 10, 0.1);
      --banner-border: rgba(255, 214, 10, 0.26);
      --banner-text: #ffd60a;
      --pico-background-color: var(--bg0);
      --pico-color: var(--text);
      --pico-muted-color: var(--muted);
      --pico-muted-border-color: var(--stroke-strong);
      --pico-primary: var(--accent);
      --pico-primary-background: var(--accent);
      --pico-primary-border: var(--accent);
      --pico-primary-hover: var(--accent-hover);
      --pico-primary-hover-background: var(--accent-hover);
      --pico-primary-hover-border: var(--accent-hover);
      --pico-form-element-background-color: var(--input-bg);
      --pico-form-element-border-color: var(--stroke-strong);
      --pico-form-element-color: var(--text);
      --pico-form-element-focus-color: var(--accent-soft);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      background: var(--bg0);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Soft ambient blobs — frosted glass backdrop */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(1100px 640px at 8% -10%, var(--blob-a), transparent 55%),
        radial-gradient(820px 560px at 92% 0%, var(--blob-b), transparent 50%),
        radial-gradient(760px 480px at 50% 102%, var(--blob-c), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg2));
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 0 auto;
      padding: 1.1rem 1.25rem 2.5rem;
    }

    /* Glass primitive */
    .glass {
      background: var(--glass);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
    }

    header.appbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 1.1rem;
      border-radius: 20px;
      margin-bottom: 1rem;
      position: sticky;
      top: 0.75rem;
      z-index: 20;
      transition: transform 0.22s ease, opacity 0.22s ease;
      will-change: transform;
    }
    header.appbar.is-hidden {
      transform: translateY(calc(-100% - 1.25rem));
      opacity: 0;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(145deg, #5ac8fa, #0071e3 55%, #5856d6);
      box-shadow: 0 6px 16px rgba(0, 113, 227, 0.26);
      flex: 0 0 auto;
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 4px;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-bottom-color: transparent;
      border-left-color: transparent;
      transform: rotate(45deg) translateY(1px);
    }
    .brand h1 {
      margin: 0;
      font-size: 1.04rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .brand .sub {
      color: var(--muted);
      font-size: 0.76rem;
      font-family: var(--mono);
      margin-top: 0.12rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .appbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-soft);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      padding: 0;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .icon-btn:hover {
      background: var(--glass-strong);
      color: var(--text);
      border-color: var(--stroke-strong);
    }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn svg { width: 18px; height: 18px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }

    .card {
      border-radius: 18px;
      padding: 1rem 1.1rem;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 0;
    }
    .card .label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .card .value {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .card .hint {
      margin-top: 0.35rem;
      font-size: 0.74rem;
      color: var(--text-secondary);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 0.85rem;
      align-items: center;
    }
    .toolbar > * {
      width: auto;
      margin: 0;
    }
    .toolbar > input,
    .toolbar > select,
    .toolbar > button {
      width: auto !important;
    }
    .panel {
      border-radius: 20px;
      padding: 1rem;
      min-width: 0;
    }
    .panel h2 {
      margin: 0 0 0.85rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }


    input, select {
      font: inherit;
      font-size: 0.85rem;
      border-radius: 12px;
      border: 1px solid var(--stroke-strong);
      background: var(--input-bg);
      color: var(--text);
      padding: 0.5rem 0.8rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    input::placeholder { color: var(--muted); }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
      background: var(--glass-strong);
    }
    input { min-width: 132px; }
    select { min-width: 118px; cursor: pointer; }

    /* Apple-style buttons — pill primary, frosted ghost */
    button.btn {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 980px;
      border: 1px solid transparent;
      background: var(--accent);
      color: #fff;
      padding: 0.5rem 1.15rem;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      white-space: nowrap;
    }
    button.btn:hover { background: var(--accent-hover); }
    button.btn:active { transform: scale(0.97); }
    button.btn.ghost {
      background: var(--glass-soft);
      color: var(--text-secondary);
      border: 1px solid var(--stroke-strong);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    button.btn.ghost:hover {
      color: var(--text);
      background: var(--glass-strong);
      border-color: var(--stroke-strong);
    }
    button.btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    label.chk {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-secondary);
      font-size: 0.83rem;
      user-select: none;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      background: var(--glass-soft);
      border: 1px solid var(--stroke);
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }
    label.chk:hover { background: var(--glass-strong); color: var(--text); }
    label.chk input { accent-color: var(--accent); min-width: 0; }

    .table-wrap {
      overflow: auto;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: var(--glass-soft);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th, td {
      text-align: left;
      padding: 0.62rem 0.7rem;
      border-bottom: 1px solid var(--stroke);
      vertical-align: middle;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      background: var(--glass-strong);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 1;
    }
    tbody tr { cursor: pointer; transition: background 0.12s ease; }
    tbody tr:hover { background: var(--row-hover); }
    tbody tr:last-child td { border-bottom: none; }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.4rem;
      padding: 0.16rem 0.5rem;
      border-radius: 999px;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 0.74rem;
    }
    .pill.ok { color: var(--ok); background: var(--ok-soft); }
    .pill.err { color: var(--err); background: var(--err-soft); }
    .pill.warn { color: var(--warn); background: var(--warn-soft); }
    .pill.neutral { color: var(--text-secondary); background: var(--track); }

    .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }
    .truncate {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.85rem;
      color: var(--muted);
      font-size: 0.83rem;
      gap: 0.75rem;
    }
    .pager .btns { display: flex; gap: 0.4rem; }

    .banner {
      background: var(--banner-bg);
      border: 1px solid var(--banner-border);
      color: var(--banner-text);
      padding: 0.8rem 1rem;
      border-radius: 16px;
      margin-bottom: 0.9rem;
      font-size: 0.88rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .banner code {
      font-family: var(--mono);
      font-size: 0.84em;
      padding: 0.1rem 0.35rem;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.06);
    }

    .empty {
      color: var(--muted);
      padding: 2.2rem 0.5rem;
      text-align: center;
      font-size: 0.88rem;
    }

    /* Frosted glass dialogs */
    dialog {
      border: 1px solid var(--stroke);
      border-radius: 22px;
      background: var(--dialog-bg);
      color: var(--text);
      padding: 0;
      box-shadow: var(--shadow);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    [data-theme="dark"] dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }
    dialog#detail {
      width: min(920px, 96vw);
      max-height: 85vh;
    }
    .dlg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.95rem 1.15rem;
      border-bottom: 1px solid var(--stroke);
    }
    .dlg-head strong {
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .dlg-body {
      padding: 1.05rem 1.15rem 1.25rem;
      overflow: auto;
      max-height: calc(85vh - 60px);
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--mono);
      font-size: 0.78rem;
      line-height: 1.5;
      background: var(--pre-bg);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 0.85rem;
    }
    .kv {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 0.4rem 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .kv dt { color: var(--muted); font-weight: 500; }
    .kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
    .section-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0 0 0.45rem;
    }
    .section-title + pre + .section-title { margin-top: 0.95rem; }

    /* Login modal */
    dialog#keyModal {
      width: min(400px, 94vw);
      border-radius: 24px;
      overflow: hidden;
    }
    .modal-card {
      padding: 2rem 1.8rem 1.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 0;
    }
    .modal-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(145deg, #5ac8fa, #0071e3 55%, #5856d6);
      box-shadow: 0 8px 20px rgba(0, 113, 227, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-bottom: 1rem;
    }
    .modal-icon svg { width: 26px; height: 26px; }
    .modal-title {
      margin: 0 0 0.3rem;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .modal-sub {
      margin: 0 0 1.25rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      line-height: 1.4;
      max-width: 300px;
    }
    #keyInput {
      width: 100%;
      text-align: left;
      padding: 0.65rem 0.9rem;
      margin-bottom: 1.25rem;
    }
    .modal-actions {
      display: flex;
      gap: 0.6rem;
      width: 100%;
    }
    .modal-actions .btn { flex: 1; padding: 0.6rem 1rem; }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="shell">
    <header class="appbar glass">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>lite-cpa · Logs</h1>
          <div class="sub" id="statusLine">loading…</div>
        </div>
      </div>
      <div class="appbar-actions">
        <button type="button" class="icon-btn" id="btnTheme" title="切换昼夜" aria-label="切换昼夜主题">
          <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden>
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="btnKey" title="设置 API Key" aria-label="设置 API Key">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="8" cy="15" r="4"/>
            <path d="M11.5 12.5 20 4M16 5l3 3"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="disabledBanner" class="banner" hidden>
      request-log 未启用。在 config.yaml 设置 <code>request-log.enabled: true</code> 后重启。
    </div>

    <div class="cards" id="cards"></div>

    <section class="panel glass" aria-labelledby="request-log-title">
      <h2 id="request-log-title">Request log</h2>
      <form class="toolbar" id="filters">
        <select id="fModel" aria-label="model">
          <option value="">model</option>
        </select>
        <input id="fUpstream" aria-label="upstream" placeholder="upstream" spellcheck="false" />
        <select id="fProtocol" aria-label="protocol">
          <option value="">protocol</option>
          <option value="chat">chat</option>
          <option value="responses">responses</option>
          <option value="claude">claude</option>
        </select>
        <label class="chk"><input type="checkbox" id="fErrors" /> errors only</label>
        <button type="submit" class="btn" id="btnApply">Apply</button>
        <button type="button" class="btn ghost" id="btnRefresh">Refresh</button>
        <label class="chk"><input type="checkbox" id="autoRefresh" checked /> auto 5s</label>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Status</th>
              <th>ms</th>
              <th>In tok</th>
              <th>Out tok</th>
              <th>TPS</th>
              <th>Model</th>
              <th>Upstream</th>
              <th>Protocol</th>
              <th>Error</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden>No requests yet.</div>
      </div>

      <div class="pager">
        <span id="pageInfo">—</span>
        <div class="btns">
          <button type="button" class="btn ghost" id="btnPrev">Prev</button>
          <button type="button" class="btn ghost" id="btnNext">Next</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="detail">
    <div class="dlg-head">
      <strong>Request detail</strong>
      <button type="button" class="btn ghost" id="btnClose">Close</button>
    </div>
    <div class="dlg-body" id="detailBody"></div>
  </dialog>

  <dialog id="keyModal">
    <form id="keyForm" class="modal-card">
      <div class="modal-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="8" cy="15" r="4"/>
          <path d="M11.5 12.5 20 4M16 5l3 3"/>
        </svg>
      </div>
      <h2 class="modal-title">Gateway API Key</h2>
      <p class="modal-sub" id="keyModalMsg">Enter your Bearer token to access the dashboard.</p>
      <input id="keyInput" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="keyCancel">Cancel</button>
        <button type="submit" class="btn" id="keySave">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    const THEME_KEY = 'lite-cpa-theme';
    const API_KEY = 'lite-cpa-api-key';
    const state = { limit: 50, offset: 0, total: 0, items: [], timer: null };

    const $ = (id) => document.getElementById(id);

    function preferredTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'light' || saved === 'dark') return saved;
      return 'light';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(THEME_KEY, theme);
      const dark = theme === 'dark';
      $('iconSun').hidden = !dark;
      $('iconMoon').hidden = dark;
      $('btnTheme').title = dark ? '切换到日间' : '切换到夜间';
    }

    let apiKeyPrompt = null;

    function currentApiKey() {
      return localStorage.getItem(API_KEY) || '';
    }

    function authHeaders(key = currentApiKey()) {
      const h = {};
      if (key) h['Authorization'] = 'Bearer ' + key;
      return h;
    }

    // Frosted-glass modal replaces native prompt(). Returns a Promise<boolean>.
    const keyModal = $('keyModal');
    const keyForm = $('keyForm');
    const keyInput = $('keyInput');
    let keyModalResolve = null;

    function setApiKey(message) {
      return new Promise((resolve) => {
        keyInput.value = currentApiKey();
        $('keyModalMsg').textContent = message || 'Enter your Bearer token to access the dashboard.';
        keyModalResolve = resolve;
        keyModal.showModal();
        setTimeout(() => keyInput.focus(), 60);
      });
    }

    function closeKeyModal(saved) {
      const fn = keyModalResolve;
      keyModalResolve = null;
      if (fn) fn(saved);
      if (typeof keyModal.close === 'function') keyModal.close();
    }

    function requestApiKey(message) {
      if (!apiKeyPrompt) {
        apiKeyPrompt = setApiKey(message).finally(() => { apiKeyPrompt = null; });
      }
      return apiKeyPrompt;
    }

    async function api(path) {
      const key = currentApiKey();
      const res = await fetch(path, { headers: authHeaders(key) });
      if (res.status === 401) {
        if (currentApiKey() !== key) return api(path);
        if (await requestApiKey('Gateway API key (Bearer):')) return api(path);
        throw new Error('unauthorized');
      }
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function statusClass(code) {
      if (code >= 500) return 'err';
      if (code >= 400) return 'warn';
      if (code >= 200 && code < 300) return 'ok';
      return 'neutral';
    }

    function fmtTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString();
    }

    function fmtTokenCount(value) {
      const count = Number(value || 0);
      return count > 0 ? count.toLocaleString() : '—';
    }

    function fmtCompactTokens(value) {
      const count = Number(value || 0);
      if (!Number.isFinite(count) || count <= 0) return '0';
      const abs = Math.abs(count);
      if (abs >= 1_000_000) {
        const m = count / 1_000_000;
        return (abs >= 10_000_000 ? m.toFixed(0) : m.toFixed(1).replace(/\.0$/, '')) + 'M';
      }
      if (abs >= 1_000) {
        const k = count / 1_000;
        return (abs >= 10_000 ? k.toFixed(0) : k.toFixed(1).replace(/\.0$/, '')) + 'K';
      }
      return String(Math.round(count));
    }

    function fmtCacheHitRate(st) {
      const input = Number(st.input_tokens || 0);
      if (input <= 0) return '—';
      const rate = Number(st.cache_hit_rate);
      if (Number.isFinite(rate) && rate >= 0) {
        return Math.round(rate * 100) + '%';
      }
      const cached = Number(st.cached_tokens || 0);
      return Math.round((cached / input) * 100) + '%';
    }

    function fmtTPS(outputTokens, durationMS) {
      const output = Number(outputTokens || 0);
      const duration = Number(durationMS || 0);
      return output > 0 && duration > 0 ? (output * 1000 / duration).toFixed(1) : '—';
    }

    function renderCards(st) {
      const cards = [
        { label: '总请求', value: st.total ?? 0, hint: '全部已记录请求' },
        { label: '输入 Token', value: fmtCompactTokens(st.input_tokens), hint: Number(st.input_tokens || 0).toLocaleString() },
        { label: '输出 Token', value: fmtCompactTokens(st.output_tokens), hint: Number(st.output_tokens || 0).toLocaleString() },
        { label: '错误', value: st.errors ?? 0, cls: 'err', hint: '状态码 ≥ 400 或存在错误' },
        { label: '缓存命中率', value: fmtCacheHitRate(st), cls: 'accent', hint: 'cached / input tokens' },
      ];
      $('cards').innerHTML = cards.map(c =>
        `<div class="card glass ${c.cls || ''}">
          <div class="label">${c.label}</div>
          <div>
            <div class="value">${c.value}</div>
            <div class="hint">${esc(c.hint || '')}</div>
          </div>
        </div>`
      ).join('');
    }

    function renderModelOptions(st) {
      const select = $('fModel');
      const selected = select.value;
      const models = [...new Set((st.by_model || [])
        .map((item) => String(item.name || ''))
        .filter(Boolean))]
        .sort((a, b) => a.localeCompare(b));
      const options = selected && !models.includes(selected) ? [selected, ...models] : models;
      select.innerHTML = `<option value="">model</option>${options.map((model) =>
        `<option value="${esc(model)}">${esc(model)}</option>`
      ).join('')}`;
      select.value = selected;
    }

    function renderRows() {
      const tbody = $('rows');
      if (!state.items.length) {
        tbody.innerHTML = '';
        $('empty').hidden = false;
      } else {
        $('empty').hidden = true;
        tbody.innerHTML = state.items.map((r, i) => {
          const sc = statusClass(r.status_code);
          return `<tr data-i="${i}">
            <td class="mono muted">${esc(fmtTime(r.timestamp))}</td>
            <td><span class="pill ${sc}">${esc(r.status_code)}</span></td>
            <td class="mono">${esc(r.duration_ms)}</td>
            <td class="mono">${fmtTokenCount(r.input_tokens)}</td>
            <td class="mono">${fmtTokenCount(r.output_tokens)}</td>
            <td class="mono">${fmtTPS(r.output_tokens, r.duration_ms)}</td>
            <td class="mono truncate" title="${esc(r.model)}">${esc(r.model || '—')}</td>
            <td class="mono truncate" title="${esc(r.upstream)}">${esc(r.upstream || '—')}</td>
            <td class="mono">${esc(r.protocol || '—')}</td>
            <td class="truncate muted" title="${esc(r.error)}">${esc(r.error || '')}</td>
          </tr>`;
        }).join('');
      }
      const from = state.total === 0 ? 0 : state.offset + 1;
      const to = Math.min(state.offset + state.items.length, state.total);
      $('pageInfo').textContent = `${from}–${to} / ${state.total}`;
      $('btnPrev').disabled = state.offset <= 0;
      $('btnNext').disabled = state.offset + state.limit >= state.total;
    }

    function openDetail(r) {
      const body = $('detailBody');
      const hasBody = !!(r.req_body || r.resp_body);
      body.innerHTML = `
        <dl class="kv">
          <dt>request_id</dt><dd>${esc(r.request_id)}</dd>
          <dt>time</dt><dd>${esc(fmtTime(r.timestamp))}</dd>
          <dt>status</dt><dd>${esc(r.status_code)} · ${esc(r.duration_ms)} ms</dd>
          <dt>input tokens</dt><dd>${esc(fmtTokenCount(r.input_tokens))}</dd>
          <dt>output tokens</dt><dd>${esc(fmtTokenCount(r.output_tokens))}</dd>
          <dt>TPS</dt><dd>${esc(fmtTPS(r.output_tokens, r.duration_ms))}</dd>
          <dt>model</dt><dd>${esc(r.model)}</dd>
          <dt>upstream</dt><dd>${esc(r.upstream)} (${esc(r.provider)})</dd>
          <dt>protocol</dt><dd>${esc(r.protocol)}</dd>
          <dt>path</dt><dd>${esc(r.method)} ${esc(r.path)}</dd>
          <dt>user-agent</dt><dd>${esc(r.user_agent)}</dd>
          <dt>error</dt><dd>${esc(r.error || '—')}</dd>
        </dl>
        ${hasBody ? `
          <div class="section-title">Request body</div>
          <pre>${esc(r.req_body || '(empty)')}</pre>
          <div class="section-title">Response body</div>
          <pre>${esc(r.resp_body || '(empty / stream omitted)')}</pre>
        ` : `<p class="muted" style="font-size:0.85rem;margin:0">Bodies not stored (store-body: false).</p>`}
      `;
      $('detail').showModal();
    }

    function queryString() {
      const p = new URLSearchParams();
      p.set('limit', String(state.limit));
      p.set('offset', String(state.offset));
      const model = $('fModel').value.trim();
      const upstream = $('fUpstream').value.trim();
      const protocol = $('fProtocol').value;
      if (model) p.set('model', model);
      if (upstream) p.set('upstream', upstream);
      if (protocol) p.set('protocol', protocol);
      if ($('fErrors').checked) p.set('errors', '1');
      return p.toString();
    }

    async function refresh() {
      try {
        const [st, list] = await Promise.all([
          api('/api/logs/stats'),
          api('/api/logs?' + queryString()),
        ]);
        $('disabledBanner').hidden = !!st.enabled;
        $('statusLine').textContent = st.enabled
          ? `enabled · total ${st.total} · ${new Date().toLocaleTimeString()}`
          : `request-log disabled · ${new Date().toLocaleTimeString()}`;
        renderCards(st);
        renderModelOptions(st);
        state.items = list.items || [];
        state.total = list.total || 0;
        state.limit = list.limit || state.limit;
        state.offset = list.offset || 0;
        renderRows();
      } catch (e) {
        $('statusLine').textContent = 'error: ' + e.message;
      }
    }

    applyTheme(preferredTheme());

    $('btnTheme').onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    };
    $('btnKey').onclick = async () => {
      if (await setApiKey()) refresh();
    };

    // Login modal wiring
    keyForm.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const trimmed = keyInput.value.trim();
      if (trimmed) localStorage.setItem(API_KEY, trimmed);
      else localStorage.removeItem(API_KEY);
      closeKeyModal(true);
    });
    $('keyCancel').onclick = () => closeKeyModal(false);
    keyModal.addEventListener('click', (ev) => {
      // backdrop click (target is the dialog itself, not the form)
      if (ev.target === keyModal) closeKeyModal(false);
    });
    keyModal.addEventListener('close', () => {
      // Esc key or programmatic close — resolve as cancelled if still pending
      if (keyModalResolve) closeKeyModal(false);
    });
    keyInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        keyForm.requestSubmit();
      }
    });

    $('rows').addEventListener('click', (ev) => {
      const tr = ev.target.closest('tr[data-i]');
      if (!tr) return;
      const r = state.items[Number(tr.dataset.i)];
      if (r) openDetail(r);
    });
    $('btnClose').onclick = () => $('detail').close();
    $('detail').addEventListener('click', (ev) => {
      if (ev.target === $('detail')) $('detail').close();
    });
    $('filters').addEventListener('submit', (ev) => {
      ev.preventDefault();
      state.offset = 0;
      refresh();
    });
    $('btnRefresh').onclick = () => refresh();
    $('btnPrev').onclick = () => {
      state.offset = Math.max(0, state.offset - state.limit);
      refresh();
    };
    $('btnNext').onclick = () => {
      state.offset = state.offset + state.limit;
      refresh();
    };
    $('autoRefresh').onchange = () => {
      if (state.timer) clearInterval(state.timer);
      if ($('autoRefresh').checked) state.timer = setInterval(refresh, 5000);
    };
    ['fUpstream'].forEach((id) => {
      $(id).addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { state.offset = 0; refresh(); }
      });
    });

    refresh();
    state.timer = setInterval(refresh, 5000);

    (function setupHeaderAutoHide() {
      const appbar = document.querySelector('header.appbar');
      if (!appbar) return;
      let lastY = window.scrollY || 0;
      let ticking = false;
      const threshold = 8;

      const update = () => {
        const y = window.scrollY || 0;
        const delta = y - lastY;
        if (y <= 16) {
          appbar.classList.remove('is-hidden');
        } else if (delta > threshold) {
          appbar.classList.add('is-hidden');
        } else if (delta < -threshold) {
          appbar.classList.remove('is-hidden');
        }
        lastY = y;
        ticking = false;
      };

      window.addEventListener('scroll', () => {
        if (!ticking) {
          window.requestAnimationFrame(update);
          ticking = true;
        }
      }, { passive: true });
    })();
  </script>
</body>
</html>
